name: KeepItAlive 24/7 Cloud Keep-Alive

on:
  schedule:
    # Runs every 10 minutes automatically 24/7/365 (Free GitHub Cloud Infrastructure)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep_alive:
    name: Ping Applications and Prevent Container Sleep
    runs-on: ubuntu-latest
    steps:
      - name: Display Timestamp
        run: echo "Starting scheduled ping batch at $(date -u)"

      - name: Ping Pulse Social Media Backend
        run: |
          echo "Sending keep-alive pulse to Pulse Social Media Backend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://pulse-backend-oepp.onrender.com")
          echo "Pulse Backend - HTTP Status: $STATUS"

      - name: Ping StudentMart Backend
        run: |
          echo "Sending keep-alive pulse to StudentMart Backend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://campusmart-api-zx74.onrender.com")
          echo "StudentMart Backend - HTTP Status: $STATUS"

      - name: Batch Summary
        run: echo "Both backends pinged successfully at $(date -u). Render containers kept warm!"
