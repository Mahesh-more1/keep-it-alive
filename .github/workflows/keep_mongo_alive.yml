name: Keep MongoDB Atlas Alive

on:
  schedule:
    # Runs every 7 days — well within MongoDB Atlas's 30-day pause limit
    - cron: '0 10 */7 * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab anytime

jobs:
  ping_mongo:
    name: Direct MongoDB Atlas Keep-Alive Ping
    runs-on: ubuntu-latest

    steps:
      - name: Display Timestamp
        run: echo "Starting MongoDB Atlas keep-alive ping at $(date -u)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MongoDB Driver
        run: npm install mongodb

      - name: Ping Cluster 1 — StudentMart (MONGO_URI)
        run: |
          node -e "
          const { MongoClient } = require('mongodb');

          async function keepAlive() {
            if (!process.env.MONGO_URI) {
              console.error('ERROR: MONGO_URI secret is not set!');
              process.exit(1);
            }
            const client = new MongoClient(process.env.MONGO_URI, {
              serverSelectionTimeoutMS: 10000,
              connectTimeoutMS: 10000,
            });
            try {
              console.log('Connecting to Cluster 1 (StudentMart)...');
              await client.connect();
              const result = await client.db('admin').command({ ping: 1 });
              console.log('Cluster 1 ping response:', JSON.stringify(result));
              console.log('SUCCESS: Cluster 1 (StudentMart) is awake! 30-day countdown RESET.');
            } catch (err) {
              console.error('FAILED to connect to Cluster 1:', err.message);
              process.exit(1);
            } finally {
              await client.close();
            }
          }

          keepAlive();
          "
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}

      - name: Ping Cluster 2 — PULse Social Media App (MONGO_URI_2)
        run: |
          node -e "
          const { MongoClient } = require('mongodb');

          async function keepAlive() {
            if (!process.env.MONGO_URI_2) {
              console.error('ERROR: MONGO_URI_2 secret is not set!');
              process.exit(1);
            }
            const client = new MongoClient(process.env.MONGO_URI_2, {
              serverSelectionTimeoutMS: 10000,
              connectTimeoutMS: 10000,
            });
            try {
              console.log('Connecting to Cluster 2 (PULse Social Media App)...');
              await client.connect();
              const result = await client.db('admin').command({ ping: 1 });
              console.log('Cluster 2 ping response:', JSON.stringify(result));
              console.log('SUCCESS: Cluster 2 (PULse) is awake! 30-day countdown RESET.');
            } catch (err) {
              console.error('FAILED to connect to Cluster 2:', err.message);
              process.exit(1);
            } finally {
              await client.close();
            }
          }

          keepAlive();
          "
        env:
          MONGO_URI_2: ${{ secrets.MONGO_URI_2 }}

      - name: Done
        run: echo "StudentMart & PULse clusters pinged successfully at $(date -u). Next ping in 7 days."
